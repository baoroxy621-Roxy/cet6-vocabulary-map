    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    &quot;message&quot;,
    (event) =&gt; {

 (()=&gt;{
 const root=document.getElementById(&#x27;cet6-network&#x27;);

 const kinds=[&#x27;syn&#x27;,&#x27;near&#x27;,&#x27;ant&#x27;,&#x27;family&#x27;,&#x27;related&#x27;,&#x27;candidate&#x27;];
 const labels={syn:&#x27;同义项 · 同词性&#x27;,near:&#x27;近义&#x27;,ant:&#x27;反义 / 对照&#x27;,family:&#x27;同概念词族 · 异词性&#x27;,related:&#x27;同主题关联&#x27;,candidate:&#x27;自动候选 · 待核义项&#x27;};
 const explanations={syn:&#x27;在指定义项上基本同义；搭配、语气或语体仍可能不同。&#x27;,near:&#x27;含义接近或常被混淆；请看每条连线的辨析。&#x27;,ant:&#x27;同一语义维度上的相反或相对概念，具体义项见下方。&#x27;,family:&#x27;同一词族的不同词性形式；表达相关概念，不能在句子中直接替换。&#x27;,related:&#x27;属于相近语义领域；仅表示主题关联。&#x27;,candidate:&#x27;来自原词库同近义字段，或同词性的相同中文释义；尚未逐对核对。&#x27;};
 const nodes=D.n.map((n,i)=&gt;({i,w:n[0],t:n[1],ph:n[2],g:n[3],extra:n[4],note:n[5]}));
 const byWord=new Map(nodes.map(n=&gt;[n.w,n]));
 const edges=D.e.map(e=&gt;({a:e[0],b:e[1],k:kinds[e[2]],note:D.notes[e[3]],source:D.sources[e[4]]}));
 const adj=nodes.map(()=&gt;[]);edges.forEach(e=&gt;{adj[e.a].push(e);adj[e.b].push(e)});
 const sortedKinds={syn:0,near:1,ant:2,family:3,related:4,candidate:5};
 const typePos={n:&#x27;n.&#x27;,v:&#x27;v.&#x27;,adj:&#x27;adj.&#x27;,adv:&#x27;adv.&#x27;,prep:&#x27;prep.&#x27;,conj:&#x27;conj.&#x27;,pron:&#x27;pron.&#x27;};
 let selected=byWord.get(&#x27;expand&#x27;),showCandidates=false,history=[],zoom=1,panX=0,panY=0,pointer=null,currentPositions=[];

 const pos=n=&gt;[...new Set(n.t.map(t=&gt;typePos[t[0]]||t[0]||&#x27;&#x27;).filter(Boolean))].join(&#x27; / &#x27;);
 const gloss=n=&gt;n.t.map(t=&gt;t[1]).join(&#x27;；&#x27;);
 const short=(s,max)=&gt;{s=s.replace(/\s+/g,&#x27;&#x27;);return s.length&gt;max?s.slice(0,max)+&#x27;…&#x27;:s};
 const fitted=(s,units)=&gt;{s=s.replace(/\s+/g,&#x27; &#x27;);let out=&#x27;&#x27;,used=0;for(const c of s){const step=/[^\x00-\x7f]/.test(c)?1:.55;if(used+step&gt;units-1)return out+&#x27;…&#x27;;used+=step;out+=c}return out};
 const other=(e,id)=&gt;nodes[e.a===id?e.b:e.a];
 const neighbors=()=&gt;adj[selected.i].filter(e=&gt;showCandidates||e.k!==&#x27;candidate&#x27;).slice().sort((a,b)=&gt;sortedKinds[a.k]-sortedKinds[b.k]||other(a,selected.i).w.localeCompare(other(b,selected.i).w));
 const button=(label,fn,cls=&#x27;btn&#x27;)=&gt;{const b=document.createElement(&#x27;button&#x27;);b.type=&#x27;button&#x27;;b.className=cls;b.textContent=label;b.onclick=fn;return b};
 for(const t of D.topics){const o=document.createElement(&#x27;option&#x27;);o.textContent=t;o.value=t;$(&#x27;[data-topic]&#x27;).append(o)}

 function choose(n,push=true){
  if(!n)return;
  if(push&amp;&amp;selected&amp;&amp;selected.i!==n.i)history.push(selected.i);
  selected=n;zoom=1;panX=0;panY=0;
  const g=n.g.length?D.groups[n.g[0]]:null;
  if(g)$(&#x27;[data-topic]&#x27;).value=g[0];
  $(&#x27;[data-back]&#x27;).disabled=!history.length;
  renderTopics();renderDetails();draw();
 }
 function renderTopics(){
  const topic=$(&#x27;[data-topic]&#x27;).value,container=$(&#x27;[data-topic-options]&#x27;);container.replaceChildren();
  for(const g of D.groups.filter(g=&gt;g[0]===topic)){
   const count=g[3].length;
   container.append(button(g[1]+&#x27; · &#x27;+count,()=&gt;choose(byWord.get(g[3][0]))));
  }
 }
 $(&#x27;[data-topic]&#x27;).onchange=()=&gt;{renderTopics();const g=D.groups.find(g=&gt;g[0]===$(&#x27;[data-topic]&#x27;).value);if(g)choose(byWord.get(g[3][0]));$(&#x27;[data-clusters]&#x27;).open=true};

 $(&#x27;[data-search]&#x27;).addEventListener(&#x27;input&#x27;,()=&gt;{
